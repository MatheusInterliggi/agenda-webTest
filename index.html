<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mia Agenda</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5" style="max-width: 500px;">
    <h2 class="text-center text-primary mb-4">Agenda Giornaliera</h2>
    
    <div class="card p-3 shadow-sm mb-4">
      <div class="row g-2 mb-3">
        <div class="col-6">
          <label for="giorno" class="form-label font-monospace">Data</label>
          <input type="date" id="giorno" class="form-control" required>
        </div>
        <div class="col-6">
          <label for="ora" class="form-label font-monospace">Orario</label>
          <input type="time" id="ora" class="form-control" required>
        </div>
      </div>
      <div class="mb-3">
        <label for="impegno" class="form-label">Impegno / Attività</label>
        <input type="text" id="impegno" class="form-control" placeholder="Es. Ripasso Informatica" required>
      </div>
      <button onclick="aggiungiImpegno()" class="btn btn-primary w-100">Aggiungi all'Agenda</button>
    </div>

    <ul id="listaImpegni" class="list-group shadow-sm"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
